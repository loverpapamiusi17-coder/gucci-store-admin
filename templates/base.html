 <!DOCTYPE html>

<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ shop_name|default("Gucci Store") }} — Админ-панель</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f5f5f2;
            color: #202020;
            font-family: Arial, sans-serif;
        }
        header {
            background: #151515;
            color: white;
            padding: 20px;
        }
        header h2 { margin: 0; letter-spacing: 2px; }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-top: 16px;
        }
        nav a { color: white; text-decoration: none; }
        main { max-width: 1100px; margin: 28px auto; padding: 0 16px; }
        h1 { font-size: 28px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .card { background: white; padding: 22px; margin-bottom: 20px; border: 1px solid #e2e2dc; border-radius: 10px; overflow-wrap: anywhere; }
        .muted { color: #777; }
        .stat { font-size: 32px; font-weight: bold; margin: 12px 0; }
        a { color: #725b2e; }
        .tablewrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .pill { background: #eee9dc; padding: 5px 9px; border-radius: 20px; }
        input, select, textarea, button { max-width: 100%; padding: 10px; margin: 5px 0; }
        button { cursor: pointer; }
        .flash { padding: 12px; background: #eee9dc; margin-bottom: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<header>
    <h2>GUCCI STORE</h2>
    <nav>
        <a href="{{ url_for('dashboard') }}">Обзор</a>
        <a href="{{ url_for('products') }}">Товары</a>
        <a href="{{ url_for('orders') }}">Заказы</a>
        <a href="{{ url_for('settings') }}">Настройки</a>
        
<form method="POST" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" style="color:white; background:#151515; border:1px solid #777;">
        Выйти
    </button>
</form>
    </nav>
</header>
<main>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
