{% extends "base.html" %}{% block content %}<h1>Товары</h1><div class="card"><h2>Добавить товар</h2><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="gridform"><div><label>Название *</label><input name="name" required maxlength="160"></div><div><label>Категория *</label><select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></div><div><label>Цена, ₽ *</label><input name="price" type="number" min="0" step="0.01" required></div><div><label>Остаток *</label><input name="stock" type="number" min="0" step="1" value="0" required></div><div class="full"><label>Описание</label><textarea name="description" maxlength="3000"></textarea></div><div class="full"><label>Фотография (JPG, PNG, WEBP, GIF; до 8 МБ)</label><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif"></div><div class="full"><label><input type="checkbox" name="active" checked> Показывать в каталоге</label></div></div><button class="btn primary" type="submit">Добавить товар</button></form></div>
{% for p in products %}<div class="card"><form method="post" action="{{url_for('update_product',pid=p.id)}}" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div style="display:flex;gap:12px;align-items:center">{% if p.image %}<img class="thumb" src="{{url_for('uploaded_file',filename=p.image)}}" alt="">{% else %}<div class="thumb"></div>{% endif %}<div><strong>#{{p.id}} · {{p.name}}</strong><div class="muted">{{'Активен' if p.active else 'Скрыт'}} · {{p.stock}} шт.</div></div></div><div class="gridform"><div><label>Название</label><input name="name" value="{{p.name}}" required></div><div><label>Категория</label><select name="category">{% for c in categories %}<option {% if c==p.category %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div><div><label>Цена, ₽</label><input name="price" type="number" min="0" step="0.01" value="{{'%.2f'|format(p.price/100)}}" required></div><div><label>Остаток</label><input name="stock" type="number" min="0" value="{{p.stock}}" required></div><div class="full"><label>Описание</label><textarea name="description">{{p.description}}</textarea></div><div class="full"><label>Заменить фотографию</label><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif"></div><div class="full"><label><input type="checkbox" name="active" {% if p.active %}checked{% endif %}> Показывать в каталоге</label></div></div><div class="actions"><button class="btn primary" type="submit">Сохранить изменения</button></div></form><form class="inline" method="post" action="{{url_for('delete_product',pid=p.id)}}" onsubmit="return confirm('Удалить товар?')"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn danger" type="submit">Удалить товар</button></form></div>{% else %}<p class="muted">Товары ещё не добавлены.</p>{% endfor %}{% endblock %}
