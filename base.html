<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>Gucci Store Admin</title><style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#25231e;--muted:#777268;--gold:#9b7b3d;--line:#e7e1d6;--red:#a53b35;--green:#2c6d48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px 16px 60px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:8px 0 18px;margin-bottom:20px}.brand{font:600 22px Georgia,serif;letter-spacing:2px}.sub{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:4px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav a,.btn{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fff;color:var(--ink);text-decoration:none;display:inline-block;font-size:13px}.nav a:hover,.btn.primary{background:#26241f;color:#fff;border-color:#26241f}.btn.danger{color:var(--red)}h1{font:normal 28px Georgia,serif;margin:8px 0 18px}h2{font:normal 20px Georgia,serif}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{font:normal 28px Georgia,serif;color:var(--gold)}.muted{color:var(--muted);font-size:13px}.flash{padding:12px;border-radius:9px;background:#eee8d8;margin:10px 0}.flash.error{background:#f8e5e3;color:#842d27}.flash.success{background:#e5f1e7;color:#255a39}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid #ddd6c9;border-radius:8px;background:#fff;color:var(--ink)}textarea{min-height:85px}input[type=checkbox]{width:auto}form.inline{display:inline}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{color:var(--muted);font-weight:600}.tablewrap{overflow:auto}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#eee}.actions{display:flex;gap:8px;flex-wrap:wrap}.gridform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.pill{display:inline-block;background:#f0eadc;padding:4px 8px;border-radius:30px;font-size:11px}@media(max-width:600px){.wrap{padding:14px 12px 40px}.head{align-items:flex-start}.brand{font-size:18px}.gridform{grid-template-columns:1fr}.full{grid-column:auto}th,td{padding:8px 6px}.nav a{padding:9px;font-size:12px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="brand">GUCCI STORE</div><div class="sub">ADMINISTRATION</div></div>{% if session.get('admin_ok') %}<form method="post" action="{{url_for('logout')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn" type="submit">Выйти</button></form>{% endif %}</header>
{% if session.get('admin_ok') %}<nav class="nav"><a href="{{url_for('dashboard')}}">Обзор</a><a href="{{url_for('products')}}">Товары</a><a href="{{url_for('orders')}}">Заказы</a><a href="{{url_for('settings')}}">Настройки</a></nav>{% endif %}
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</div></body></html>
