{% extends "base.html" %}{% block content %}<h1>Настройки магазина</h1><div class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Название магазина</label><input name="shop_name" value="{{values.shop_name}}" required><label>Валюта</label><select name="currency"><option value="RUB" {% if values.currency=='RUB' %}selected{% endif %}>RUB — рубли</option><option value="EUR" {% if values.currency=='EUR' %}selected{% endif %}>EUR — евро</option><option value="USD" {% if values.currency=='USD' %}selected{% endif %}>USD — доллары</option></select><label>Информация о доставке</label><textarea name="delivery_text">{{values.delivery_text}}</textarea><label>Поля оформления заказа (описание)</label><input name="checkout_fields" value="{{values.checkout_fields}}"><label>Username менеджера Telegram (необязательно)</label><input name="manager_username" value="{{values.manager_username}}" placeholder="@manager"><button class="btn primary" style="margin-top:16px" type="submit">Сохранить настройки</button></form></div><div class="card"><h2>Уведомления в Telegram</h2><p class="muted">Добавь TELEGRAM_BOT_TOKEN и ADMIN_CHAT_ID в переменные окружения сервера. Токен не вставляй в HTML и не отправляй в публичные чаты.</p></div>{% endblock %}
